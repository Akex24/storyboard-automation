name: Build Windows .exe

# Триггер: создание GitHub Release (тег `app-v*`).
# SendUpdateThread в Studio создаёт Release через REST API
# (`POST /releases`) — это НЕ git push тега, поэтому event `push: tags`
# может не сработать. `release: published` срабатывает гарантированно
# при API-создании Release с draft=false (как у нас в create_github_release).
# Mac-сборка остаётся локальной (./build.sh + SendUpdateThread грузит .app
# под именем `Storyboard Studio vX.Y.Z-mac.zip`). Этот workflow добавляет
# к тому же Release файл `… vX.Y.Z-win.zip` с .exe.
on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      # Нужно чтобы upload в Release работал через GITHUB_TOKEN.
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # При release event default ref = тег. Для checkout берём
          # содержимое тега (там же лежит обновлённый version.json и
          # .spec файлы текущего релиза).
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/StoryboardStudio.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        # Важно: тот же набор пакетов что в BUILD_WINDOWS.md + certifi (он
        # явно используется в .spec через `certifi.where()`).
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow requests pyinstaller certifi python-docx opencv-python-headless numpy

      - name: Extract version from release
        id: version
        shell: bash
        env:
          # tag_name приходит из release event (надёжнее чем парсить
          # GITHUB_REF — `release: published` устанавливает event payload).
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="$TAG_NAME"                          # app-v1.0.14
          VERSION="${TAG#app-v}"                   # 1.0.14
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Building Storyboard Studio v$VERSION for Windows"

      - name: Build .exe with PyInstaller
        run: pyinstaller StoryboardStudio.spec --noconfirm

      - name: Verify Studio onedir exists
        shell: bash
        run: |
          # 2026-05-08: onedir mode — собирается папка
          # `dist/Storyboard Studio/` с .exe + _internal/.
          if [ ! -f "dist/Storyboard Studio/Storyboard Studio.exe" ]; then
            echo "::error ::dist/Storyboard Studio/Storyboard Studio.exe not found"
            ls -la dist/ || true
            ls -la "dist/Storyboard Studio/" || true
            exit 1
          fi
          ls -la "dist/Storyboard Studio/"

      - name: Build installer .exe
        run: pyinstaller StoryboardStudioInstaller.spec --noconfirm

      - name: Create ZIP asset
        shell: pwsh
        # 2026-05-08 v2: упаковка ДВУХ отдельных asset'ов:
        # 1) Storyboard Studio v<v>-win.zip — содержит ТОЛЬКО onedir-папку
        #    Studio (без Installer.exe). Используется DownloadAppUpdateThread
        #    (авто-обновления внутри Studio) и DownloadAppExeThread в
        #    installer'е (первая установка).
        # 2) Storyboard Studio Installer v<v>.exe — отдельный файл-установщик
        #    для коллеги. Скачивает сам, без zip-обёртки. Один клик —
        #    запуск, дальше installer сам тянет Studio из (1).
        # Это убирает дублирование (раньше zip содержал и Studio и Installer
        # — коллега качал ~250МБ, потом installer пытался скачать Studio
        # ещё раз). Теперь коллега качает только installer ~80МБ.
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "Storyboard Studio v$version-win.zip"
          $installerOut = "Storyboard Studio Installer v$version.exe"
          $studioDir = "dist/Storyboard Studio"
          $installerExe = "dist/Storyboard Studio Installer.exe"
          if (-not (Test-Path $studioDir)) {
            Write-Error "Missing: $studioDir (onedir bundle)"
            exit 1
          }
          if (-not (Test-Path $installerExe)) {
            Write-Error "Missing: $installerExe"
            exit 1
          }
          # zip только Studio onedir
          Compress-Archive -Path $studioDir `
              -DestinationPath "dist/$zipName" -Force
          # Installer.exe — копируем под версионное имя
          Copy-Item $installerExe "dist/$installerOut" -Force
          Get-Item "dist/$zipName", "dist/$installerOut" `
              | Select-Object FullName, Length

      - name: Upload assets to existing Release
        # Тег уже создан админом локально через SendUpdateThread (вместе с
        # Mac-zip). Этот шаг прикрепляет ОБА Win-asset'а к Release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag     = "${{ steps.version.outputs.tag }}"
          $zipPath = "dist/Storyboard Studio v$version-win.zip"
          $installerPath = "dist/Storyboard Studio Installer v$version.exe"
          gh release upload "$tag" "$zipPath" --clobber
          gh release upload "$tag" "$installerPath" --clobber
